suite: controller configuration
templates:
  - controller-configmap.yaml
tests:
  - it: defaults session idle retention to seven days
    asserts:
      - equal:
          path: data.KAGENT_SESSION_IDLE_TTL
          value: 168h

  - it: allows session expiration to be disabled
    set:
      controller.sessionIdleTTL: "0"
    asserts:
      - equal:
          path: data.KAGENT_SESSION_IDLE_TTL
          value: "0"

  - it: allows a longer session idle lifetime
    set:
      controller.sessionIdleTTL: 720h
    asserts:
      - equal:
          path: data.KAGENT_SESSION_IDLE_TTL
          value: 720h

  - it: defaults to insecure controller authentication
    asserts:
      - isSubset:
          path: data
          content:
            KAGENT_AUTH_MODE: insecure
            KAGENT_AUTH_USER_ID_CLAIM: ""

  - it: configures trusted proxy authentication and the identity claim
    set:
      controller.auth.mode: trusted-proxy
      controller.auth.userIdClaim: email
    asserts:
      - isSubset:
          path: data
          content:
            KAGENT_AUTH_MODE: trusted-proxy
            KAGENT_AUTH_USER_ID_CLAIM: email

  - it: supplies sandbox policy defaults
    asserts:
      - isSubset:
          path: data
          content:
            KAGENT_SANDBOX_CPU: "1"
            KAGENT_SANDBOX_MEMORY: 1Gi
            KAGENT_SANDBOX_DEFAULT_TTL: 1h
            KAGENT_SANDBOX_MAX_TTL: 24h

  - it: applies sandbox policy overrides through the ConfigMap
    set:
      controller.sandbox.cpu: "2"
      controller.sandbox.memory: 2Gi
      controller.sandbox.defaultTTL: 30m
      controller.sandbox.maxTTL: 2h
    asserts:
      - isSubset:
          path: data
          content:
            KAGENT_SANDBOX_CPU: "2"
            KAGENT_SANDBOX_MEMORY: 2Gi
            KAGENT_SANDBOX_DEFAULT_TTL: 30m
            KAGENT_SANDBOX_MAX_TTL: 2h
